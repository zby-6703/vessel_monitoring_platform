[api]
apiDebug=0
secret=change-me-zlm-secret
snapRoot=./www/snap/

[general]
enableVhost=0
flowThreshold=1024
maxStreamWaitMS=15000
mediaServerId=vesselsight-zlm-01
mergeWriteMS=0
streamNoneReaderDelayMS=20000

[http]
charSet=utf-8
keepAliveSecond=30
maxReqSize=40960
port=80
rootPath=./www
sendBufSize=65536
sslport=443

[protocol]
enable_audio=1
enable_fmp4=1
enable_hls=1
enable_mp4=0
enable_rtmp=1
enable_rtsp=1
enable_ts=1
enable_ws=1
fmp4_demand=0
hls_demand=0
rtmp_demand=0
rtsp_demand=0
ts_demand=0

[rtc]
externIP=
port=8000
preferredCodecA=PCMA,PCMU,opus
preferredCodecV=H264,H265,AV1,VP9,VP8
rembBitRate=0
tcpPort=8000

[rtmp]
port=1935

[rtp_proxy]
port=10000
port_range=30000-35000

[rtsp]
directProxy=1
handshakeSecond=15
keepAliveSecond=15
port=554

[shell]
maxReqSize=1024
port=9000

